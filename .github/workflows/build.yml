name: build

# One job on macOS arm64: test, build, sign and upload the app. Runs on every
# push (including PR branches, so pull requests get checks without a second
# run) and on demand.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}-

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Signing identity
        env:
          HYPRDARWIN_SIGNING_P12: ${{ secrets.HYPRDARWIN_SIGNING_P12 }}
          HYPRDARWIN_SIGNING_PASSWORD: ${{ secrets.HYPRDARWIN_SIGNING_PASSWORD }}
        run: scripts/ci-signing-keychain.sh

      - name: Build app
        run: |
          scripts/build-app.sh
          ditto -c -k --keepParent build/hyprdarwin.app build/hyprdarwin.zip

      - uses: actions/upload-artifact@v7
        with:
          name: hyprdarwin-app
          path: build/hyprdarwin.zip
          retention-days: 14
          if-no-files-found: error
